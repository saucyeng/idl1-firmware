name: firmware-release

# Builds the ESP-IDF firmware and publishes it to a GitHub Release on a version
# tag. Version of record = the tag (leading `v` stripped) -> version.txt ->
# esp_app_desc_t.version, which the app reads over /ping and the §7.3 status line
# to offer OTA updates.
#
# Release asset contract (idl1-app ruling R198, read by idl1-app's
# rust/transport/src/firmware_catalog.rs): exactly one `.bin` asset per release,
# `idl1-firmware-<ver>.bin` (no leading `v`), plus its checksum sidecar
# `idl1-firmware-<ver>.bin.sha256` in `sha256sum` output format
# (`<hex>  <filename>`). The app installs only a release carrying that exact
# `.bin` name; the sidecar is what arms auto-confirm. Never publish a second
# `.bin` (`build/` also contains `ota_data_initial.bin`, an 8-byte otadata
# seed, which a naive `find`/`head` could publish instead of the app image).
#
# The app's catalog reads GitHub's public releases API with no token, so it
# sees these releases only while this repo is public.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Derive version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > version.txt

      - name: Build firmware (ESP-IDF)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32c6
          path: '.'

      - name: Stage release assets
        id: assets
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # esp-idf-ci-action builds in Docker as root, so build/ is
          # root-owned and this (runner-user) step cannot write into it —
          # stage into a fresh runner-owned dist/ instead (v0.1.0 first-run
          # lesson). Reading root-owned build output is fine.
          APP_BIN=build/idl1_firmware.bin   # fixed by project(idl1_firmware) in CMakeLists.txt
          test -f "$APP_BIN" || { echo "::error::app image not found at $APP_BIN"; exit 1; }
          V="${VERSION}"
          mkdir -p dist
          cp "$APP_BIN" "dist/idl1-firmware-${V}.bin"
          (cd dist && sha256sum "idl1-firmware-${V}.bin" > "idl1-firmware-${V}.bin.sha256")
          echo "bin=dist/idl1-firmware-${V}.bin" >> "$GITHUB_OUTPUT"
          echo "sha=dist/idl1-firmware-${V}.bin.sha256" >> "$GITHUB_OUTPUT"
          # Symbols for this exact image (JTAG backtraces, panic decoding).
          # An .elf, never a second .bin, so the asset contract above holds.
          cp build/idl1_firmware.elf "dist/idl1-firmware-${V}.elf"
          echo "elf=dist/idl1-firmware-${V}.elf" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ steps.ver.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.bin }}
            ${{ steps.assets.outputs.sha }}
            ${{ steps.assets.outputs.elf }}
